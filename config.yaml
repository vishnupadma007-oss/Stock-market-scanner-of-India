# ------------------------------------------------------------------
# Trading agent team settings. Edit these from your phone on GitHub.
# ------------------------------------------------------------------

capital: 30000             # starting paper-trading capital (₹); realised P&L is added back

# Two teams trade side by side, each with its own paper capital and one trade at a time, to see
# which finds more chances and makes more money. The evening review keeps a scoreboard.
teams:
  movers:                  # top gainers/losers reversal: price, chart, options, sector moves only
    capital: 30000
    news_votes: false      # true = also let news/filings/forecast agents vote on its trades
    news_guard: true       # borrow the news team's knowledge as a safety brake: skip a stock with results today,
                           # regulatory action, a policy hit, or strong news against the trade
  news:                    # NSE filings, results, concalls, news -> Data Analyzer forecasts
    capital: 30000
    top_up: 13304          # 26 Oct: paper top-up back to Rs 30,000 after the PNB/IOC losses (user gave free hands);
                           # one F&O lot often costs more than the Rs 16,696 left. Not profit: the scoreboard keeps -Rs 13,304
    auto_trade: true       # opens trades by itself; Claude can also open them with paper_trade.py
    min_confidence: 60     # forecast confidence needed, after the priced-in cut
    confirm_pct: 0.5       # the stock must already move the forecast's way by this much today
    max_move_pct: 4.0      # ...but not more (move used up)
    max_age_min: 120       # forget ideas older than this
    min_trend_score: 60    # Trend Checker (agents/momentum.py): the chart must back the news (0-100)
    early_entry: true      # user, 23 Oct: don't always wait for 0.5%. From a 0.2% move the news's way, enter when the
    early_pct: 0.2         # latest 5-min candle has 1.5x the usual volume (same time of day) closing the news's way AND the
    early_volume_x: 1.5    # NSE order book holds 1.5x more buyers than sellers (reverse for "down"). Replaces the Trend
    early_book_x: 1.5      # Checker for those entries. Untestable on history (no NSE order-book data): judged on paper.
    min_premium: 5.0       # no options under ₹5 (22 Oct: PNB ₹2.06 and IOC ₹1.85 were the two big losses)
    max_capital_per_trade: 1.0  # user, 26 Oct: no per-trade limit; a trade may use all the free money (was 0.5)
max_capital_per_trade: 1.0   # share of available money one trade may use (1.0 = all of it)
max_trades_per_day: 50     # effectively no cap: trade every setup that passes the agents
net_target_pct: 1.0        # target profit per trade, % of premium paid, AFTER all charges

# How often the watcher looks. INDmoney allows 500 calls per hour for the whole account.
# The watcher spreads its share evenly (450/hour = one call every 8 s, never in bursts), so:
# with no trade open, entry scans run back to back (one full scan takes about 2 minutes);
# with a trade open, its exit price is checked every 15 seconds.
scan_interval_min: 0
exit_check_seconds: 15
indmoney_hourly_budget: 420   # counted like INDmoney does (details calls per instrument); leaves ~80 for Claude
# One trade at a time: while a trade is open, no new trades or signals (no Claude credits).
# Setups that qualify meanwhile are only recorded in journal/held_setups.csv (checked every
# hold_scan_min). After the exit, a fresh scan runs on the next tick.
one_trade_at_a_time: true
hold_scan_min: 10

# Exits. No stop-loss: a trade exits at the target or at square-off time.
square_off_time: "15:20"   # always exit intraday positions by this time (IST); NSE closes 15:30
entry_start: "09:15"      # user decision 22 Oct: trade from the open (charts still need a few candles)
entry_end: "15:15"         # last fresh entry; late entries pass only if the Risk agent still sees a 60%+ chance of the target before square-off

# Scanner
top_n: 5                   # how many gainers and losers to send to the chart reader
min_move_pct: 2.0          # minimum day move to count as a top gainer/loser
min_turnover_cr: 50        # minimum 20-day average daily turnover (₹ crore)

# Which movers to trade: "loser" = buy CE on a bouncing top loser, "gainer" = buy PE on a
# fading top gainer. Backtest (Aug-Oct 2026): losers +0.51%/trade, gainers -1.01%/trade.
sides: [loser, gainer]

# Market regime agent
max_vix: 22                # above this India VIX -> no trades
trend_day_nifty_pct: 1.2   # Nifty move that marks a strong trend day

# Macro agent (sector, crude oil, rupee). Backtest: turned -0.35%/trade into +0.10%.
use_macro: true
macro:
  sector_trend_pct: 1.5     # sector index move that counts as "the whole sector is moving"
  sector_points: -15
  crude_move_pct: 1.5
  crude_points: -20
  rupee_move_pct: 0.4
  rupee_points: -10

# News & Events agent (live only: no news history exists to backtest it)
news:
  block_results_day: true   # skip stocks with results today or yesterday evening
  fresh_news_points: -25    # fresh news that explains the move = real catalyst
  volume_spike_ratio: 3.0   # "sudden pressure": last 15 min volume vs normal
  results_workers: 20       # results filings read at once (downloads overlap; OCR itself runs one per CPU core)

# Crowd Psychology agent: futures OI build-up / short covering / long unwinding, 52-week
# extremes, circuit frenzy. No OI history exists to backtest it, so it starts in "observe"
# mode (readings logged and compared in the evening review). Switch to "score" once the
# paper trades show it helps.
psychology:
  mode: observe

# Valuation agent: P/E (P/B for lenders) vs sector peers, from Yahoo once a day. Observe mode:
# shown on signals and logged per trade; switch to score once the evening review shows it helps.
valuation:
  mode: observe
  agree_points: 5       # expensive gainer fading (PE) / cheap loser bouncing (CE)
  against_points: -5

# Candlestick Patterns agent (agents/candles.py): 19 classic patterns, shown on signals.
# Observe mode (points 0): on 60 days of our 76 stocks (263,000 5-min candles, 22 Oct 2026)
# no pattern predicted the next 30 minutes better than chance. Re-test with
# `python -m agents.candles test` before giving it points.
candles:
  points: 0

# Announcements agent: NSE's live corporate-filings feed (results, ratings, orders, deals,
# regulatory actions), read every 30 s while the watcher runs. Results filings are parsed for
# revenue/profit growth and reported as RESULT events; major filings as NEWS.
info_poll_seconds: 30   # news feeds, valuations and the Data Analyzer run on their own track this often
filings_poll_seconds: 10  # NSE filings (results, orders, regulatory) have their own faster thread: one call covers all companies

# News agent (RSS: ET, Mint, Business Standard, CNBC-TV18, Google News for global/India macro)
# and Data Analyzer (combines filings, concalls and news into a forecast per stock).
# (Indian news feeds every 30 s; Google News searches every 2 min so Google does not block us)
analyzer:
  forecast_score: 2.0   # stock's own news score (max 3) for a FORECAST; also needs 2+ sources or one major item
  min_sources: 2
  agree_points: 10      # analyzer agrees with a reversal trade's direction
  against_points: -20   # news flow points the other way

# Commodities agent: MCX crude, natural gas, gold, silver, copper, aluminium, zinc, nickel.
commodities:
  move_pct: 1.5       # move that matters for the stocks linked to it
  points: -20         # when the move pushes the stock against the trade
  shock_pct: 3.0      # move reported once a day as a COMMODITY event for Claude to explain

# Forecast agent: likely reversal level (VWAP or 38% retracement) is shown on every signal.
# Backtest: blocking on it lowered results (-0.74%/trade), and aiming the target at it cut
# the hit rate from 90% to 63% (-3.16%/trade), so both are off.
forecast_filter: false
target_mode: fixed          # "forecast" aims for forecast_capture of the forecast move
forecast_capture: 0.7

# Decision
min_chart_score: 60        # chart-reader score needed for a TRADE signal
min_hit_probability: 60    # forecast chance (%) the stock moves enough for the target before square-off
assumed_spread_pct: 0.8    # bid-ask gap of the option, % of premium (real value used when live quotes exist)

# Options
strike_choice: "ITM1"       # "ATM" or "ITM1". ITM1: smaller worst loss in the backtest; all lots fit ₹30,000 (survey 2026-10-19)
min_days_to_expiry: 3      # roll to next month's expiry when closer than this
# Live contracts (both teams): this month's expiry, except in expiry week, where next month's is
# used when this month's option is unusable. Backtest (60 days) was neutral on rolling early; real
# near-expiry options are often cheap with wide gaps (IOC 27-Oct 130 PE: Rs 1.40, 6.3% gap vs
# 23-Nov: Rs 3.85, 2.8%), so this only rescues setups that would otherwise be skipped or badly priced.
expiry_fallback:
  enabled: true
  days: 7                  # within this many calendar days of this month's expiry...
  min_premium: 5.0         # ...switch when this month's option is cheaper than this
  max_spread_pct: 2.0      # ...or its bid-ask gap is wider than this (% of the ask)
risk_free_rate: 0.065

# Charges (verify with your broker's calculator)
charges:
  brokerage_per_order: 20      # flat ₹ per executed order
  stt_sell_pct: 0.1            # STT on option sell premium
  exchange_txn_pct: 0.03503    # NSE option transaction charge on premium
  sebi_per_crore: 10
  stamp_buy_pct: 0.003
  gst_pct: 18

# AI analyst (Claude). Needs ANTHROPIC_API_KEY in Streamlit secrets.
ai:
  enabled: true
  model: "claude-opus-5-5"
  effort: "medium"
  max_candidates: 3          # AI reviews only the best few -> keeps token cost low
  web_search: true           # let the AI check news for the move's real cause

