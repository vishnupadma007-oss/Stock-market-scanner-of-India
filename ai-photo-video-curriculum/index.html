<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Lens Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap">
<style>
/* Layout: editing-suite feel — top bar with tabs, level rail, module "frames" in a single readable column; tools as a filterable price sheet. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#e3e7ea; --fg:#1b2126; --muted:#5b6670; --line:#cfd5da;
  --accent:#a8325f; --accent-ink:#ffffff; --accent-soft:#f6e3ea;
  --lvl1:#2f7d5b; --lvl2:#2c6aa0; --lvl3:#a8325f; --lvl4:#7a4fb0;
  --free:#2f7d5b; --paid:#8a5a12;
  --display:"Archivo","Noto Sans Devanagari",system-ui,sans-serif; --body:"Source Sans 3","Noto Sans Devanagari",system-ui,sans-serif; --mono:"JetBrains Mono","Noto Sans Devanagari",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16191c; --surface:#1f2428; --surface-2:#2a3036; --fg:#e7ebee; --muted:#9aa6b0; --line:#353c43;
  --accent:#e86f9d; --accent-ink:#1a0d13; --accent-soft:#3a2230;
  --lvl1:#5cc493; --lvl2:#6fa8dc; --lvl3:#e86f9d; --lvl4:#b394e6; --free:#5cc493; --paid:#e0b05c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191c; --surface:#1f2428; --surface-2:#2a3036; --fg:#e7ebee; --muted:#9aa6b0; --line:#353c43;
  --accent:#e86f9d; --accent-ink:#1a0d13; --accent-soft:#3a2230;
  --lvl1:#5cc493; --lvl2:#6fa8dc; --lvl3:#e86f9d; --lvl4:#b394e6; --free:#5cc493; --paid:#e0b05c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
html[lang="hi"] body{line-height:1.7}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
.hero{padding-block:24px 20px;display:grid;gap:12px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.lang button{font:600 14px var(--body);border:0;background:none;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.1;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{max-width:65ch;color:var(--muted);margin:0;font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px}
.tab{font:600 15px var(--display);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:14px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.progress{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.meter{width:120px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.levelhead{display:flex;align-items:baseline;gap:12px;margin:32px 0 12px;flex-wrap:wrap}
.levelhead h2{font-family:var(--display);font-stretch:105%;font-size:24px;margin:0}
.levelhead p{margin:0;color:var(--muted);flex-basis:100%;max-width:65ch}
.lvl-tag{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:var(--surface);background:var(--c)}
.modules{display:grid;gap:12px}
details.mod{background:var(--surface);border:1px solid var(--line);border-radius:8px;border-left:4px solid var(--c)}
details.mod summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
details.mod summary::-webkit-details-marker{display:none}
.frame{font-family:var(--mono);font-size:12px;color:var(--muted);grid-row:span 2;align-self:start;padding-top:3px;min-width:44px}
.mtitle{font-family:var(--display);font-weight:700;font-size:18px;margin:0;min-width:0}
.msub{color:var(--muted);font-size:14px;grid-column:2;min-width:0}
.done-pill{grid-row:span 2;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.done-pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.mbody{padding:0 18px 18px;display:grid;gap:18px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.mbody{grid-template-columns:minmax(0,1fr)}}
.mbody h4{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ul.lessons{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.lessons label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.lessons input{margin-top:5px;accent-color:var(--accent)}
.toolchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font:600 13px var(--body);background:var(--surface-2);border:0;border-radius:4px;padding:4px 8px;color:var(--fg);cursor:pointer}
.tchip small{font-family:var(--mono);color:var(--muted);font-weight:400;margin-left:4px}
ul.tuts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.tuts a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--fg);padding:8px 10px;border-radius:6px;background:var(--surface-2)}
ul.tuts a:hover{background:var(--accent-soft)}
.play{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-top:1px}
.play::after{content:"";border-left:7px solid var(--accent-ink);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
ul.tuts span small{display:block;color:var(--muted);font-size:13px}
.task{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:15px}
.task b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
.search{flex:1 1 220px;min-width:0;font:15px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
select{font:14px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.flash td{background:var(--accent-soft)}
td.name a{font-weight:600}
td.price{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptype{display:inline-block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:3px;border:1px solid currentColor;margin-bottom:4px}
.ptype.free,.ptype.freemium{color:var(--free)} .ptype.subscription,.ptype.one-time,.ptype.credits{color:var(--paid)}
.note{color:var(--muted);font-size:14px;max-width:70ch;margin-top:16px}
.toolsh{font-family:var(--display);margin:0 0 12px}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-bottom:24px}
.kit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kit h3{font-family:var(--display);margin:0 0 4px;font-size:17px}
.kit .cost{font-family:var(--mono);color:var(--accent);font-size:14px;margin-bottom:6px}
.kit p{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){details.mod[open] .mbody{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-4px)}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap hero">
    <div class="toprow">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <div class="lang" role="group" aria-label="Language / भाषा">
        <button id="lang-en" data-lang="en" aria-pressed="true">English</button>
        <button id="lang-hi" data-lang="hi" aria-pressed="false">हिंदी</button>
      </div>
    </div>
    <h1><span class="brand">AI Lens Academy:</span> <span data-i18n="h1"></span></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="stats" id="stats"></div>
  </div>
</header>
<nav class="tabs" role="tablist">
  <div class="wrap">
    <button class="tab" role="tab" id="tab-curriculum" aria-selected="true" data-view="curriculum" data-i18n="tabCur"></button>
    <button class="tab" role="tab" id="tab-tools" aria-selected="false" data-view="tools" data-i18n="tabTools"></button>
  </div>
</nav>

<main class="wrap">
  <section id="view-curriculum">
    <div class="bar" id="levelbar"></div>
    <div id="curriculum"></div>
  </section>
  <section id="view-tools" hidden>
    <h2 class="toolsh" data-i18n="budgetH"></h2>
    <div class="budget" id="budget"></div>
    <div class="bar">
      <input class="search" id="toolsearch" type="search">
      <select id="catfilter" aria-label="Category"></select>
      <select id="pricefilter" aria-label="Pricing type"></select>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thTool"></th><th data-i18n="thCat"></th><th data-i18n="thUse"></th><th data-i18n="thPrice"></th><th data-i18n="thUsed"></th></tr></thead>
      <tbody id="toolrows"></tbody>
    </table></div>
    <p class="note" data-i18n="note"></p>
  </section>
</main>

// ---------- state ----------
let done = {};
try{ done = JSON.parse(localStorage.getItem("ala-done")||"{}") }catch(e){}
const save = ()=>{ try{ localStorage.setItem("ala-done",JSON.stringify(done)) }catch(e){} };
let lang = "en";
try{ lang = localStorage.getItem("ala-lang")||"en" }catch(e){}
if(location.hash==="#hi") lang="hi"; else if(location.hash==="#en") lang="en";
let levelFilter = 0;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const totalLessons = MODULES.reduce((n,m)=>n+m.en.lessons.length,0);
const u = k => UI[lang][k];
const cat = c => lang==="hi" ? (CAT_HI[c]||c) : c;

function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=u(el.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("toolsearch").placeholder = u("search");
  const cf = document.getElementById("catfilter"), cv = cf.value;
  cf.innerHTML = `<option value="">${u("allCat")}</option>`+[...new Set(TOOLS.map(t=>t.cat))].map(c=>`<option value="${esc(c)}">${esc(cat(c))}</option>`).join("");
  cf.value = cv;
  const pf = document.getElementById("pricefilter"), pv = pf.value;
  pf.innerHTML = [["",u("allPrice")],["free",u("pFree")],["freemium",u("pFreemium")],["subscription",u("pSub")],["one-time",u("pOne")],["credits",u("pCred")]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  pf.value = pv;
  document.getElementById("budget").innerHTML = BUDGET.map(b=>`<div class="kit"><h3>${b[lang][0]}</h3><div class="cost">${b.cost}</div><p>${b[lang][1]}</p></div>`).join("");
}

function renderStats(){
  const d = Object.values(done).filter(Boolean).length;
  document.getElementById("stats").innerHTML =
   `<span><b>${LEVELS.length}</b> ${u("levels")}</span><span><b>${MODULES.length}</b> ${u("modules")}</span><span><b>${totalLessons}</b> ${u("lessons")}</span><span><b>${TOOLS.length}</b> ${u("tools")}</span><span><b>${d}</b> ${u("doneN")}</span>`;
}

function renderLevelbar(){
  const d = Object.values(done).filter(Boolean).length, pct = Math.round(d/totalLessons*100);
  document.getElementById("levelbar").innerHTML =
   [{id:0,label:u("all")},...LEVELS.map(l=>({id:l.id,label:l[lang][0]}))].map(l=>`<button class="chip" data-lvl="${l.id}" aria-pressed="${levelFilter===l.id}">${l.label}</button>`).join("")+
   `<span class="progress">${pct}% ${u("complete")} <span class="meter"><i style="width:${pct}%"></i></span></span>`;
}

function renderCurriculum(){
  const open = new Set([...document.querySelectorAll("details.mod[open]")].map(d=>d.id));
  let n = 0, html = "";
  for(const L of LEVELS){
    const mods = MODULES.filter(m=>m.lvl===L.id);
    if(levelFilter && levelFilter!==L.id){ n += mods.length; continue; }
    html += `<div class="levelhead" style="--c:${L.c}"><span class="lvl-tag">${u("level")} ${L.id}</span><h2>${L[lang][0]}</h2><p>${L[lang][1]}</p></div><div class="modules">`;
    for(const m of mods){
      n++;
      const t = m[lang];
      const cnt = t.lessons.filter((_,i)=>done[m.id+"-"+i]).length;
      html += `<details class="mod" id="${m.id}" style="--c:${L.c}" ${open.has(m.id)?"open":""}>
       <summary><span class="frame">${u("mod")} ${String(n).padStart(2,"0")}</span><h3 class="mtitle">${esc(t.title)}</h3>
        <span class="done-pill ${cnt===t.lessons.length?"ok":""}">${cnt}/${t.lessons.length}</span><span class="msub">${esc(t.sub)}</span></summary>
       <div class="mbody">
        <div style="display:grid;gap:16px;min-width:0">
         <div><h4>${u("hLessons")}</h4><ul class="lessons">${t.lessons.map((l,i)=>{const k=m.id+"-"+i;return `<li><label><input type="checkbox" id="cb-${k}" data-k="${k}" ${done[k]?"checked":""}><span>${esc(l)}</span></label></li>`}).join("")}</ul></div>
         <div><h4>${u("hTools")}</h4><div class="toolchips">${m.tools.map(id=>`<button class="tchip" data-tool="${id}">${esc(T[id].name)}<small>${esc(T[id].price.split("·")[0].trim())}</small></button>`).join("")}</div></div>
         <div class="task"><b>${u("hTask")}</b>${esc(t.task)}</div>
        </div>
        <div style="min-width:0"><h4>${u("hTuts")}</h4><ul class="tuts">${m.tuts.map(([te,th,ch,q])=>`<li><a href="${YT(lang==="hi"?q+" Hindi":q)}" target="_blank" rel="noopener"><span class="play"></span><span>${esc(lang==="hi"?th:te)}<small>${esc(ch)} · YouTube</small></span></a></li>`).join("")}</ul></div>
       </div></details>`;
    }
    html += `</div>`;
  }
  document.getElementById("curriculum").innerHTML = html;
}

function usedIn(id){ return MODULES.filter(m=>m.tools.includes(id)).map(m=>MODULES.indexOf(m)+1) }
function renderTools(){
  const q = document.getElementById("toolsearch").value.toLowerCase().trim();
  const c = document.getElementById("catfilter").value, p = document.getElementById("pricefilter").value;
  const rows = TOOLS.filter(t=>(!c||t.cat===c)&&(!p||t.type===p)&&(!q||(t.name+" "+t.cat+" "+cat(t.cat)+" "+t.use+" "+t.hi).toLowerCase().includes(q)));
  document.getElementById("toolrows").innerHTML = rows.length ? rows.map(t=>`<tr id="tool-${t.id}">
    <td class="name"><a href="${t.url}" target="_blank" rel="noopener">${esc(t.name)}</a></td><td>${esc(cat(t.cat))}</td><td>${esc(lang==="hi"?t.hi:t.use)}</td>
    <td class="price"><span class="ptype ${t.type}">${u("ptype")[t.type]}</span><br>${esc(t.price)}</td>
    <td class="price">${usedIn(t.id).map(n=>u("mod")+" "+String(n).padStart(2,"0")).join(", ")}</td></tr>`).join("")
    : `<tr><td colspan="5">${u("none")}</td></tr>`;
}

function show(view){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  document.getElementById("view-curriculum").hidden = view!=="curriculum";
  document.getElementById("view-tools").hidden = view!=="tools";
}
function renderAll(){ applyStatic(); renderStats(); renderLevelbar(); renderCurriculum(); renderTools(); }

// ---------- init ----------
renderAll();
const firstMod = document.getElementById("m1"); if(firstMod) firstMod.open = true;

document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;try{localStorage.setItem("ala-lang",lang)}catch(err){}renderAll()});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));
document.getElementById("levelbar").addEventListener("click",e=>{const b=e.target.closest("[data-lvl]");if(!b)return;levelFilter=+b.dataset.lvl;renderLevelbar();renderCurriculum()});
document.getElementById("curriculum").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;done[k]=e.target.checked;save();renderStats();renderLevelbar();renderCurriculum()});
document.getElementById("curriculum").addEventListener("click",e=>{const b=e.target.closest("[data-tool]");if(!b)return;
  document.getElementById("toolsearch").value="";document.getElementById("catfilter").value="";document.getElementById("pricefilter").value="";renderTools();show("tools");
  const r=document.getElementById("tool-"+b.dataset.tool);if(r){r.scrollIntoView({block:"center"});r.classList.add("flash");setTimeout(()=>r.classList.remove("flash"),1600)}});
["toolsearch","catfilter","pricefilter"].forEach(id=>document.getElementById(id).addEventListener("input",renderTools));
if(location.hash==="#tools") show("tools");
</script>
</body>
